name: medsvyaz24-lite
services:
  web:
    image: medsvyaz24:lite
    build: .
    ports:
      - "${MEDSVYAZ_PORT:-5182}:5173"
    environment:
      HOST: "0.0.0.0"
      PORT: "5173"
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
